<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forum Victorum</title>
  <meta name="robots" content="noindex">
  <!--
    Fallback page for profile share links (https://ennoboesenberg.github.io/u/<UUID>).

    When the app is installed, iOS intercepts the universal link and opens
    the app directly — this page is never seen. It only renders when the
    recipient does NOT have the app: GitHub Pages has no file at /u/<UUID>,
    so it serves this repo-root 404.html for any unmatched path. The script
    pulls the profile ID out of the path and offers "Open in App" (custom
    scheme) plus a "Get the App" App Store button.

    NOTE: every asset path here must be ABSOLUTE ("/styles.css", not
    "styles.css"). This file is served at arbitrary paths like /u/<UUID>, so
    a relative path would resolve to /u/styles.css and 404.

    Because this file also answers every *other* unmatched path, the copy
    switches: a valid /u/<UUID> gets the friend-request invitation, anything
    else gets a plain "page not found".
  -->
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="centered">
  <div class="wrap">

    <header class="masthead">
      <img src="/icon.png" alt="Forum Victorum app icon" width="84" height="84">
      <div>
        <p class="eyebrow">Forum Victorum</p>
        <h1 id="headline">Add me as a friend</h1>
      </div>
    </header>

    <div class="card">
      <p id="blurb">Open this link in the Forum Victorum app to send a friend request. Don't have it yet? Get the app, then tap the link again.</p>
      <a class="btn primary" id="store" href="#">Get the App</a>
      <a class="btn secondary" id="open" href="#">Open in App</a>
    </div>

    <footer>
      <p><a href="/">Support</a> · <a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms of Use</a></p>
      <p>© 2026 Enno Bösenberg. All rights reserved.</p>
    </footer>

  </div>

  <script>
    // TODO: replace with the real App Store product URL once the app is
    // public (App Store Connect → App → "View on App Store"), e.g.
    // https://apps.apple.com/app/idXXXXXXXXXX . Until then this can point
    // at a public TestFlight link.
    var APP_STORE_URL = "https://apps.apple.com/app/forum-victorum/id000000000";

    // Extract the profile UUID from /u/<UUID>.
    var match = location.pathname.match(/\/u\/([0-9a-fA-F-]{36})/);
    var id = match ? match[1] : null;

    var store = document.getElementById("store");
    store.href = APP_STORE_URL;

    var open = document.getElementById("open");
    if (id) {
      open.href = "theleague://user/" + id;
    } else {
      // No valid id in the path — this is a generic 404, so drop the
      // friend-request framing and hide the deep-link button.
      open.style.display = "none";
      document.getElementById("headline").textContent = "Page not found";
      document.getElementById("blurb").textContent =
        "That link doesn't point anywhere we recognise. If someone shared their Forum Victorum profile with you, ask them to send the link again.";
      document.title = "Forum Victorum — Page not found";
    }
  </script>
</body>
</html>
